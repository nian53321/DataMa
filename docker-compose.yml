services:
  backend:
    build: ./back
    ports:
      - "5000:5000"
    env_file:
      - ./back/.env
    environment:
      # Orbbec/RealSense 深度相机：USB 是独占资源，单 worker + gthread 多线程
      # gthread 支持 MJPEG 长连接（预览流），多线程避免预览阻塞其他请求；
      # 线程数给足（预览流为长连接会长期占用线程，卡住的探测也会占线程）
      - GUNICORN_WORKERS=1
      - GUNICORN_WORKER_CLASS=gthread
      - GUNICORN_THREADS=16
      - GUNICORN_TIMEOUT=0
    volumes:
      - backend-data:/app/data_lake
      - backend-logs:/app/logs
      - ./back/keys:/app/keys
      # 宿主机采集服务录制输出目录（后端需写入预览 mp4，故挂载为读写）
      - ./output:/app/host_output
    # 映射 USB 设备到容器（Orbbec Femto Bolt 通过 USB 3.0 连接）
    # privileged 确保容器有足够权限访问 USB 设备
    privileged: true
    devices:
      - /dev/bus/usb:/dev/bus/usb
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      # 从根目录 .env 读取 DB_PASSWORD（deploy.ps1 自动生成并同步）
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-DataMgmt2026Secure}
      MYSQL_DATABASE: data_management
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-DataMgmt2026Secure}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  celery-worker:
    build: ./back
    command: celery -A app.tasks.celery_app worker --loglevel=info
    env_file:
      - ./back/.env
    volumes:
      - backend-data:/app/data_lake
      - ./back/keys:/app/keys
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./front
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
  backend-logs:
  mysql-data:
